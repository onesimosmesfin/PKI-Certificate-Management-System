# Application & Server
spring.application.name=pkiCertificateManagment
server.port=8081

# MySQL / XAMPP Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/pkicertificatemanagement?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=      
# ⬅️ FIX 1: Password is empty for XAMPP default root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# FIX 2: Removed the deprecated 'hibernate.dialect' line to stop warnings (Spring Boot auto-detects it)

# Application Secrets
pki.master-secret=${PKI_MASTER_SECRET:ChangeThisSecret123!}

# SoftHSM PKCS#11 Configuration
softhsm.pkcs11.library=C:/SoftHSM2/lib/softhsm2-x64.dll
softhsm.slot.pin=1234
softhsm.slot.index=0

# FIX 3: Disable Redis completely (since XAMPP does not include Redis)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.devtools.restart.enabled=false
